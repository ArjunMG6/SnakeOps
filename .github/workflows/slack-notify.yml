name: Slack Notifications

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop
    types: [opened, closed, reopened]

  issues:
    types: [opened, closed]

  release:
    types: [published]

jobs:
  slack-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Determine Event Type
        id: event_type
        run: echo "event=${{ github.event_name }}" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "${{ steps.event_type.outputs.event }} event occurred on *${{ github.repository }}*:\n\n${
                {
                  'push': "🚀 *${{ github.actor }}* pushed to `${{ github.ref_name }}`.\n💬 Commit: `${{ github.event.head_commit.message }}`\n🔗 <${{ github.event.head_commit.url }}|View Commit>",
                  'pull_request': "📦 *${{ github.actor }}* submitted a pull request to `${{ github.base_ref }}`.\n📝 Title: `${{ github.event.pull_request.title }}`\n🔗 <${{ github.event.pull_request.html_url }}|View PR>",
                  'issues': "🗂️ *${{ github.actor }}* ${{
                    github.event.action == 'opened' && 'opened' || 'closed'
                  }} an issue: `${{ github.event.issue.title }}`\n🔗 <${{ github.event.issue.html_url }}|View Issue>",
                  'release': "🏷️ New release `${{ github.event.release.tag_name }}` published by *${{ github.actor }}*.\n📝 <${{ github.event.release.html_url }}|View Release>"
                }[github.event_name]
              }"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

